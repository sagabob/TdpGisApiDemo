name: Build and Publish Docker Hub Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Full image names, e.g. dockerhub-user/tdpgis-endpoints and dockerhub-user/tdpgis-api
  IMAGE_ENDPOINTS: ${{ vars.DOCKERHUB_IMAGE_ENDPOINTS }}
  IMAGE_API: ${{ vars.DOCKERHUB_IMAGE_API }}
  IMAGE_LOCAL_API: ${{ vars.DOCKERHUB_IMAGE_LOCAL_API }}

jobs:
  dockerhub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: ./_Backend/global.json

      # MTP mode (global.json test.runner) requires cwd under _Backend and --project
      # https://aka.ms/dotnet-test-mtp-error
      - name: Run backend unit tests
        working-directory: ./_Backend
        shell: bash
        run: |
          shopt -s globstar nullglob
          projects=(./tests/**/*.csproj)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects found under ./tests"
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Running tests for $project"
            dotnet test --project "$project" --configuration Release --nologo
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate datetime tag
        id: dt
        run: echo "value=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (TdpGis.Endpoints)
        id: meta_endpoints
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_ENDPOINTS }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.dt.outputs.value }}

      - name: Build and push TdpGis.Endpoints
        uses: docker/build-push-action@v6
        with:
          context: ./_Backend
          file: ./_Backend/TdpGis.Endpoints/Dockerfile
          push: true
          tags: ${{ steps.meta_endpoints.outputs.tags }}
          labels: ${{ steps.meta_endpoints.outputs.labels }}

      - name: Extract Docker metadata (TdpGis.Api)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.dt.outputs.value }}

      - name: Build and push TdpGis.Api
        uses: docker/build-push-action@v6
        with:
          context: ./_Backend
          file: ./_Backend/TdpGis.Api/Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Extract Docker metadata (TdpGis.LocalApi)
        id: meta_local_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LOCAL_API }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.dt.outputs.value }}

      - name: Build and push TdpGis.LocalApi
        uses: docker/build-push-action@v6
        with:
          context: ./_Backend
          file: ./_Backend/TdpGis.LocalApi/Dockerfile
          push: true
          tags: ${{ steps.meta_local_api.outputs.tags }}
          labels: ${{ steps.meta_local_api.outputs.labels }}
